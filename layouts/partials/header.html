		<a class="header__avatar" href="/"><img src="{{$avatar.RelPermalink}}" alt="Mahmud Ridwan" width="42" height="42"></a>
		<span class="header__title">
			{{- if . -}}

			{{- end -}}
		</span>
	</h1>
	{{partial "themetoggle.html" .}}
